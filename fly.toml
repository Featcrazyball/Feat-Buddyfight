# fly.toml app configuration file generated for buddyfight on 2026-05-18T17:41:28+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'buddyfight'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'buddyfight_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '4gb'
  cpus = 2
  memory_mb = 4096
